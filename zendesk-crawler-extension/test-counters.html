<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Counter Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }
    .counters {
      font-size: 12px;
      color: #7f8c8d;
      margin-top: 10px;
      padding: 8px;
      background-color: #f8f9fa;
      border-radius: 4px;
    }
    .counters div {
      margin: 2px 0;
    }
  </style>
</head>
<body>
  <h2>Counter Test</h2>
  
  <div id="counters" class="counters">
    <div>Current chunk: <span id="chunkProgress">0%</span></div>
    <div>Chunks written: <span id="chunksWritten">0</span></div>
    <div>Chunks downloaded: <span id="chunksDownloaded">0</span></div>
    <div>Pages crawled: <span id="pagesCrawled">0</span></div>
  </div>
  
  <button onclick="testCounters()">Test Counters</button>
  
  <script>
    function testCounters() {
      // Simulate storage data
      const testData = {
        crawledData: Array(25).fill({}), // 25 pages in storage
        dataBuffer: Array(15).fill({}),  // 15 pages in buffer
        bufferSize: 512 * 1024,          // 0.5MB (50%)
        chunkCounter: 3,                  // 3 chunks written
        chunksDownloaded: 2               // 2 actually downloaded (1 pending)
      };
      
      updateCounters(testData);
    }
    
         function updateCounters(result) {
       const data = result.crawledData || [];
       const buffer = result.dataBuffer || [];
       const bufferSize = result.bufferSize || 0;
       const chunkCounter = result.chunkCounter || 0;
       const chunksDownloaded = result.chunksDownloaded || 0;
       
       // Calculate chunk progress percentage
       const maxBufferSize = 1024 * 1024; // 1MB
       const progressPercent = Math.min(Math.round((bufferSize / maxBufferSize) * 100), 100);
       document.getElementById('chunkProgress').textContent = `${progressPercent}%`;
       
       // Update chunks written
       document.getElementById('chunksWritten').textContent = chunkCounter;
       
       // Update pages crawled (stored + buffer)
       const totalPages = data.length + buffer.length;
       document.getElementById('pagesCrawled').textContent = totalPages;
       
       // Update chunks downloaded (separate from written)
       document.getElementById('chunksDownloaded').textContent = chunksDownloaded;
     }
  </script>
</body>
</html>
