<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Extension Storage Test</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .stats { margin: 20px 0; padding: 10px; background: #f0f0f0; }
    button { margin: 5px; padding: 10px; }
  </style>
</head>
<body>
  <h1>Extension Storage Test</h1>
  
  <div class="stats">
    <div>Pages crawled: <span id="pagesCrawled">0</span></div>
    <div>Links found: <span id="linksFound">0</span></div>
    <div>Content size: <span id="contentSize">0 KB</span></div>
  </div>
  
  <button onclick="testExtensionStorage()">Test Extension Storage</button>
  <button onclick="readExtensionStorage()">Read Extension Storage</button>
  <button onclick="clearExtensionStorage()">Clear Extension Storage</button>
  
  <div id="debug"></div>
  
  <script>
    function log(message) {
      console.log(message);
      document.getElementById('debug').innerHTML += '<div>' + message + '</div>';
    }
    
    function testExtensionStorage() {
      log('Testing extension storage...');
      
      const testData = [
        {
          url: 'https://test.com/page1',
          title: 'Test Page 1',
          content: 'This is test content for page 1',
          links: ['https://test.com/link1', 'https://test.com/link2'],
          images: []
        },
        {
          url: 'https://test.com/page2',
          title: 'Test Page 2',
          content: 'This is test content for page 2 with more text to make it longer',
          links: ['https://test.com/link3'],
          images: []
        }
      ];
      
      // Test Chrome storage API
      if (typeof chrome !== 'undefined' && chrome.storage && chrome.storage.local) {
        log('Chrome storage API available');
        chrome.storage.local.set({crawledData: testData}, function() {
          if (chrome.runtime.lastError) {
            log('Error saving to Chrome storage: ' + chrome.runtime.lastError.message);
          } else {
            log('Data saved to Chrome storage successfully');
            readExtensionStorage();
          }
        });
      } else {
        log('Chrome storage API not available');
      }
    }
    
    function readExtensionStorage() {
      log('Reading extension storage...');
      
      if (typeof chrome !== 'undefined' && chrome.storage && chrome.storage.local) {
        chrome.storage.local.get(['crawledData'], function(result) {
          if (chrome.runtime.lastError) {
            log('Error reading from Chrome storage: ' + chrome.runtime.lastError.message);
          } else {
            log('Chrome storage data: ' + JSON.stringify(result));
            updateCounters(result.crawledData || []);
          }
        });
      } else {
        log('Chrome storage API not available');
      }
    }
    
    function clearExtensionStorage() {
      log('Clearing extension storage...');
      
      if (typeof chrome !== 'undefined' && chrome.storage && chrome.storage.local) {
        chrome.storage.local.set({crawledData: []}, function() {
          if (chrome.runtime.lastError) {
            log('Error clearing Chrome storage: ' + chrome.runtime.lastError.message);
          } else {
            log('Chrome storage cleared successfully');
            updateCounters([]);
          }
        });
      } else {
        log('Chrome storage API not available');
      }
    }
    
    function updateCounters(data) {
      log('Updating counters with ' + data.length + ' pages');
      
      document.getElementById('pagesCrawled').textContent = data.length;
      
      const totalLinks = data.reduce((sum, page) => sum + (page.links ? page.links.length : 0), 0);
      document.getElementById('linksFound').textContent = totalLinks;
      
      const totalSize = data.reduce((sum, page) => sum + (page.content ? page.content.length : 0), 0);
      document.getElementById('contentSize').textContent = `${Math.round(totalSize / 1024)} KB (${totalSize} bytes)`;
      
      log('Counters updated: pages=' + data.length + ', links=' + totalLinks + ', size=' + totalSize);
    }
    
    // Initialize
    log('Extension test page loaded');
    readExtensionStorage();
  </script>
</body>
</html>
